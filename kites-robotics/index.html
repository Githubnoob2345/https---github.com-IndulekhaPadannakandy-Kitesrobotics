function makeRandomRKIDs(count=100, existing=[]){
 const used=new Set(existing.map(k=>String(k.id))),out=[];
 while(out.length<count){const a=crypto.getRandomValues(new Uint32Array(1))[0];const id=String(100000+(a%900000));if(!used.has(id)){used.add(id);out.push({id})}}
 // Shuffle so neither display nor generation order appears sequential.
 for(let i=out.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[out[i],out[j]]=[out[j],out[i]]}
 return out;
}

function candyMap(){
 const pr=DB.prog[S.id]||{},doneCount=Object.values(pr).filter(x=>x&&x.done).length;
 const nodes=P.map((p,i)=>({p,i,done:!!(pr[i]&&pr[i].done),unlocked:i===0||!!(pr[i-1]&&pr[i-1].done)}));
 // Candy-Crush layout: a single winding path, Level 1 at the bottom and the final level at the top.
 const step=104, width=320, height=Math.max(520,nodes.length*step+56);
 const xAt=i=>[160,218,246,202,126,76,94,154,224,246,190,112,70,126,204,250,218,146,84,72][i%20];
 const pointAt=i=>({x:xAt(i),y:height-step/2-i*step});
 let path='';
 for(let i=0;i<nodes.length;i++){
   const a=pointAt(i);
   if(i===0){path=`M ${a.x} ${a.y}`;continue;}
   const b=pointAt(i-1),cy=(a.y+b.y)/2;
   path+=` C ${b.x} ${cy} ${a.x} ${cy} ${a.x} ${a.y}`;
 }
 const svg=`<svg class="candy-path-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true"><path class="path-shadow" d="${path}"/><path class="path-main" d="${path}"/></svg>`;
 const levelNodes=nodes.map(n=>{
   const pt=pointAt(n.i);
   const state=n.done?'is-done':n.unlocked?'is-open':'is-locked';
   return `<div class="candy-stop" style="left:${pt.x/width*100}%;top:${pt.y}px"><button type="button" class="level-node candy-circle ${state} ${n.unlocked&&!n.done?'level-pulse':''}" ${n.unlocked?'':'disabled'} data-level-index="${n.i}" onclick="gate(${n.i})" title="${n.unlocked?'Open':'Locked'}: ${esc(n.p[0])}" aria-label="Level ${n.i+1}: ${esc(n.p[0])}"><span class="node-num">${n.done?'✓':n.unlocked?'★':'🔒'}</span><span class="circle-level">${n.i+1}</span></button><span class="candy-level-name">${esc(n.p[0])}</span></div>`;
 }).join('');
 return `<section class="candy-wrap"><div class="candy-head"><div><span class="eyebrow">YOUR ROBOTICS QUEST</span><h3>Adventure Map</h3><p class="mut">Follow the winding path from Level 1 at the bottom to Level ${nodes.length} at the top.</p></div><div class="candy-progress">⭐ ${doneCount}/${P.length}</div></div><div class="candy-map candy-winding" style="height:${height}px"><div class="candy-finish">🏁 Robotics Master!</div>${svg}${levelNodes}</div><div class="candy-legend"><span>⭐ Completed</span><span>✨ Current level</span><span>🔒 Locked</span></div><p class="mut candy-foot">Complete each project to unlock the next level. Your progress is saved in this browser.</p></section>`;
}

// Every project navigation route now respects level locks; completing a project celebrates unlocks.
function navigateProject(direction){
 const next=cur+direction;
 if(next<0||next>=P.length)return;
 if(S.role==='client'){
   const pr=DB.prog[S.id]||{};
   if(direction>0&&!((pr[cur]||{}).done)){toast('📘 Tap “Mark as studied” to unlock the next project.');return;}
   if(next>=2&&![0,1].every(j=>(pr[j]||{}).done)){toast('🔒 Complete both introduction projects first.');return;}
   if(next>0&&!((pr[next-1]||{}).done)){toast('🔒 Complete project '+next+' first to unlock this level.');return;}
 }
 openM(next);
}
// Prev / Next walk through every tab (Overview > ... > Video) and then across projects.
function stepNav(dir){
 const LAST=6;
 const top=()=>{const m=document.getElementById('m'),b=document.getElementById('mb');if(m)m.scrollTop=0;if(b)b.scrollTop=0;};
 if(dir>0){
   if(tab<LAST){tab++;render();top();return;}
   if(cur>=P.length-1)return;
   navigateProject(1);top();                    // locks: current project must be studied first
 }else{
   if(tab>0){tab--;render();top();return;}
   if(cur<=0)return;
   navigateProject(-1);                         // opens previous project on its Overview tab...
   tab=LAST;render();top();                     // ...then jump to its Video tab
 }
}

const _doneFixedBase=done;
done=function(i){
 if(S.role!=='client'||!Number.isInteger(i)||i<0||i>=P.length)return;
 const pr=DB.prog[S.id]||{};
 if(pr[i]&&pr[i].done){closeM();go('courses');return;}
 // Do not allow completion to skip earlier levels.
 if(i>0&&!(pr[i-1]&&pr[i-1].done)){toast('🔒 Complete the previous project first.');return;}
 if(i>=2&&![0,1].every(j=>pr[j]&&pr[j].done)){toast('🔒 Complete both introduction projects first.');return;}
 const before=Object.values(pr).filter(x=>x&&x.done).length;
 _doneFixedBase(i);
 const after=Object.values(DB.prog[S.id]||{}).filter(x=>x&&x.done).length;
 if(after>before){
   const next=i+1;
   closeM();
   go('courses');
   if(after===2)toast('🎉 Congratulations! You passed the introduction level! Level 3 is now unlocked! 🎊',7000);
   else if(after===P.length)toast('🏆 Amazing! You completed all 40 robotics levels!',8000);
   else toast('🎉 Project studied! Returning to your level map…',4500);
   if(next<P.length){
     setTimeout(()=>{
       const node=document.querySelector('.level-node[data-level-index="'+next+'"]');
       if(node){node.classList.remove('level-unlock-pop');void node.offsetWidth;node.classList.add('level-unlock-pop');node.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center',inline:'center'});}
     },100);
   }
